[project]
name = "search-anything"
version = "0.1.0"
description = "Multimodal search for personal files"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.30.0",
    "boto3==1.43.107",
    "fastapi==0.142.2",
    "librosa==0.11.0",
    "httpx==0.28.1",
    "numpy==1.26.4",
    "openai-whisper==20250625",
    "pgvector==0.4.2",
    "pillow==11.3.0",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "python-multipart>=0.0.32",
    "python-docx==1.2.0",
    "sentence-transformers==6.1.0",
    "sqlalchemy[asyncio]==2.0.54",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
search-anything = "search_anything.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
